openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GoPack AI Group Travel Planner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI generation endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /itinerary:
    post:
      operationId: generateItinerary
      tags: [ai]
      summary: Generate AI trip itinerary
      description: Uses Claude to generate a day-by-day itinerary based on trip details and wishes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryInput"
      responses:
        "200":
          description: Generated itinerary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /packing:
    post:
      operationId: generatePackingList
      tags: [ai]
      summary: Generate AI packing list
      description: Uses Claude to generate a categorized packing list for a trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackingInput"
      responses:
        "200":
          description: Generated packing list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackingResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/{tripId}/expenses:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTripExpenses
      summary: Read the member-only expense ledger
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseLedger" }
    post:
      operationId: addTripExpense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "201":
          description: Saved ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseLedger" }
  /trips/{tripId}/expenses/{expenseId}:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string } }
      - { name: expenseId, in: path, required: true, schema: { type: string } }
    put:
      operationId: editTripExpense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "200":
          description: Saved ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseLedger" }
    delete:
      operationId: deleteTripExpense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseDeletionInput" }
      responses:
        "200":
          description: Saved ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseLedger" }
  /trips/{tripId}/settlements:
    parameters:
      - { name: tripId, in: path, required: true, schema: { type: string } }
    post:
      operationId: recordTripSettlement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementInput" }
      responses:
        "201":
          description: Saved ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseLedger" }
components:
  schemas:
    ExpenseDeletionInput:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
    ExpenseInput:
      type: object
      required: [title, amountMinor, currency, category, date, payerId, participantIds, splitMethod]
      properties:
        title: { type: string }
        amountMinor: { type: integer }
        currency: { type: string }
        category: { type: string, enum: [Food, Accommodation, Transportation, Activities, Shopping, Other] }
        date: { type: string }
        payerId: { type: string }
        participantIds: { type: array, items: { type: string } }
        splitMethod: { type: string, enum: [equal, custom] }
        shares: { type: object, additionalProperties: { type: integer } }
        notes: { type: string }
        revision: { type: integer }
    ExpenseRecord:
      allOf:
        - { $ref: "#/components/schemas/ExpenseInput" }
        - type: object
          required: [id, tripId, creatorId, editorId, createdAt, updatedAt, shares, revision]
          properties:
            id: { type: string }
            tripId: { type: string }
            creatorId: { type: string }
            editorId: { type: string }
            createdAt: { type: string }
            updatedAt: { type: string }
            deletedAt: { type: string }
            shares: { type: object, additionalProperties: { type: integer } }
            revision: { type: integer }
    SettlementInput:
      type: object
      required: [fromId, toId, amountMinor, currency, date]
      properties:
        fromId: { type: string }
        toId: { type: string }
        amountMinor: { type: integer }
        currency: { type: string }
        date: { type: string }
    SettlementRecord:
      allOf:
        - { $ref: "#/components/schemas/SettlementInput" }
        - type: object
          required: [id, tripId, creatorId, createdAt, status]
          properties:
            id: { type: string }
            tripId: { type: string }
            creatorId: { type: string }
            createdAt: { type: string }
            status: { type: string, enum: [completed] }
    ExpenseMemberBalance:
      type: object
      required: [id, name, paidMinor, shareMinor, balanceMinor, isCurrentMember]
      properties:
        id: { type: string }
        name: { type: string }
        paidMinor: { type: integer }
        shareMinor: { type: integer }
        balanceMinor: { type: integer }
        isCurrentMember: { type: boolean }
    ExpenseRepayment:
      type: object
      required: [fromId, toId, amountMinor]
      properties:
        fromId: { type: string }
        toId: { type: string }
        amountMinor: { type: integer }
    ExpenseLedger:
      type: object
      required: [currency, currencyLocked, expenses, settlements, members, totalMinor, repayments]
      properties:
        currency: { type: string }
        currencyLocked: { type: boolean }
        expenses: { type: array, items: { $ref: "#/components/schemas/ExpenseRecord" } }
        settlements: { type: array, items: { $ref: "#/components/schemas/SettlementRecord" } }
        members: { type: array, items: { $ref: "#/components/schemas/ExpenseMemberBalance" } }
        totalMinor: { type: integer }
        repayments: { type: array, items: { $ref: "#/components/schemas/ExpenseRepayment" } }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Wish:
      type: object
      properties:
        id:
          type: string
        wishId:
          type: string
        text:
          type: string
        author:
          type: string
        votes:
          type: integer
      required:
        - text
        - author
        - votes

    ItineraryInput:
      type: object
      properties:
        destination:
          type: string
          description: Trip destination(s)
        days:
          type: integer
          description: Number of trip days
        vibes:
          type: array
          items:
            type: string
          description: Trip vibes (culture, food, adventure, etc.)
        budget:
          type: string
          description: Budget level (budget, midrange, luxury)
        startDate:
          type: ["string", "null"]
          description: Trip start date (YYYY-MM-DD)
        wishes:
          type: array
          items:
            $ref: "#/components/schemas/Wish"
          description: Legacy group wishes sorted by votes
        guaranteed:
          type: array
          items:
            $ref: "#/components/schemas/Wish"
          description: Wishes that must appear in the itinerary
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Wish"
          description: Wishes to include when slots allow
      required:
        - destination
        - days
        - vibes
        - budget

    Activity:
      type: object
      properties:
        time:
          type: string
        name:
          type: string
        description:
          type: string
        tag:
          type: string
        fromWish:
          type: boolean
        suggester:
          type: string
        estimatedCost:
          type: number
        labels:
          type: array
          items:
            type: string
        nearPrevious:
          type: boolean
        actId:
          type: ["string", "null"]
      required:
        - time
        - name
        - description
        - tag
        - fromWish
        - suggester
        - estimatedCost
        - labels
        - nearPrevious

    ItineraryDay:
      type: object
      properties:
        dayNumber:
          type: integer
        city:
          type: string
        theme:
          type: string
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
      required:
        - dayNumber
        - city
        - theme
        - activities

    ItineraryResult:
      type: object
      properties:
        title:
          type: string
        days:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryDay"
      required:
        - title
        - days

    PackingInput:
      type: object
      properties:
        destination:
          type: string
        days:
          type: integer
        vibes:
          type: array
          items:
            type: string
        budget:
          type: string
      required:
        - destination
        - days
        - vibes
        - budget

    PackingList:
      type: object
      properties:
        essentials:
          type: array
          items:
            type: string
        clothing:
          type: array
          items:
            type: string
        toiletries:
          type: array
          items:
            type: string
        tech:
          type: array
          items:
            type: string
        activities:
          type: array
          items:
            type: string
        tips:
          type: array
          items:
            type: string
      required:
        - essentials
        - clothing
        - toiletries
        - tech
        - activities
        - tips

    PackingResult:
      type: object
      properties:
        list:
          $ref: "#/components/schemas/PackingList"
      required:
        - list
